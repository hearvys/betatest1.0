<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTAL PURGE | HearvyS Launch</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            color: #ff4757;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .loading-box {
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        .welcome {
            font-size: 1.8em;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .sub {
            color: #555;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .bar-container {
            width: 100%;
            height: 6px;
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            width: 0%;
            height: 100%;
            background: #ff4757;
            box-shadow: 0 0 15px #ff4757;
            transition: width 0.2s;
        }

        #status {
            margin-top: 15px;
            font-size: 0.7em;
            color: #444;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="loading-box">
    <div class="welcome">Добро пожаловать</div>
    <div class="sub">Скоро вы будете в меню...</div>
    
    <div class="bar-container">
        <div class="bar-fill" id="progress"></div>
    </div>
    
    <div id="status">Подготовка файлов HearvyS...</div>
</div>

<script>
    const bar = document.getElementById('progress');
    const status = document.getElementById('status');
    
    let width = 0;
    const phrases = [
        "Загрузка ресурсов...",
        "Проверка доступа...",
        "Настройка интерфейса...",
        "Готово к запуску!"
    ];

    const timer = setInterval(() => {
        width += Math.random() * 10;
        if (width >= 100) {
            width = 100;
            clearInterval(timer);
            setTimeout(startMainGame, 500);
        }
        bar.style.width = width + "%";
        
        // Меняем фразы
        if(width > 25) status.innerText = phrases[0];
        if(width > 50) status.innerText = phrases[1];
        if(width > 75) status.innerText = phrases[2];
        if(width === 100) status.innerText = phrases[3];

    }, 150);

    function startMainGame() {
        // ВАЖНО: Мы просто запускаем твой index.html
        // Если он лежит в папке TOTAL_PURGE, путь будет "TOTAL_PURGE/index.html"
        // Если лежит в той же папке, просто "index.html"
        window.location.href = "TOTAL_PURGE/index.html"; 
    }
</script>

</body>
</html>
