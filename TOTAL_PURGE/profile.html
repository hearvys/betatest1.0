<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ПРОФИЛЬ ОПЕРАТОРА</title>
    <style>
        body { background: #050505; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .profile-card { background: #111; border: 1px solid #ff4757; padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 0 30px rgba(255, 71, 87, 0.2); }
        .avatar { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #ff4757; margin-bottom: 20px; object-fit: cover; }
        h1 { margin: 10px 0; letter-spacing: 3px; color: #ff4757; }
        p { color: #ccc; line-height: 1.6; }
        .stats { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin: 20px 0; text-align: left; font-family: monospace; }
        .back-btn { display: inline-block; margin-top: 20px; color: #ff4757; text-decoration: none; border: 1px solid #ff4757; padding: 10px 20px; border-radius: 5px; transition: 0.3s; }
        .back-btn:hover { background: #ff4757; color: white; }
    </style>
</head>
<body>

<div class="profile-card" id="profile">
    <img src="" id="user-img" class="avatar">
    <h1 id="user-name">ЗАГРУЗКА...</h1>
    <p id="user-desc"></p>
    <div class="stats" id="user-stats"></div>
    <a href="index.html" class="back-btn">НАЗАД В МЕНЮ</a>
</div>

<script>
    const data = {
        hearvys: {
            name: "HearvyS",
            img: "author_player.png",
            desc: "Главный визионер и геймдизайнер проекта TOTAL PURGE. Создал визуальный стиль и атмосферу игры.",
            stats: "> РАНГ: Создатель<br>> ЛЮБИМОЕ ОРУЖИЕ: RPG-7<br>> СТАТУС: В сети"
        },
        gemini: {
            name: "Gemini AI",
            img: "author_ai.png",
            desc: "Искусственный интеллект, отвечающий за архитектуру кода, поведение зомби и техническую стабильность.",
            stats: "> МОДЕЛЬ: Flash 2.0<br>> ПРОТОКОЛ: Google DeepMind<br>> ЗАДАЧА: Поддержка HearvyS"
        }
    };

    const params = new URLSearchParams(window.location.search);
    const user = params.get('user');

    if (data[user]) {
        document.getElementById('user-name').innerText = data[user].name;
        document.getElementById('user-img').src = data[user].img;
        document.getElementById('user-desc').innerText = data[user].desc;
        document.getElementById('user-stats').innerHTML = data[user].stats;
    } else {
        document.getElementById('user-name').innerText = "ОБЪЕКТ НЕ НАЙДЕН";
    }
</script>
</body>
</html>
