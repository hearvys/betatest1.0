<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TOTAL PURGE: NO FRICTION</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: 'Segoe UI', sans-serif; cursor: crosshair; }
        canvas { display: block; }
        
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; display: none; }
        #hp-bar { width: 300px; height: 18px; background: #111; border: 2px solid #444; border-radius: 5px; overflow: hidden; }
        #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4757, #990000); transition: 0.2s; }
        #stats { font-size: 22px; margin-top: 10px; text-shadow: 2px 2px #000; font-weight: bold; }
        #ammo-ui { position: absolute; bottom: 30px; right: 30px; font-size: 30px; color: #f1c40f; display: none; font-weight: 900; }

        #boss-ui { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); display: none; text-align: center; width: 500px; z-index: 10; }
        #boss-hp-bar { height: 15px; background: #111; border: 2px solid #ff0000; margin-top: 5px; box-shadow: 0 0 20px #ff0000; }
        #boss-fill { height: 100%; width: 100%; background: #ff0000; }

        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.97); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .menu-container { background: rgba(20,20,20,0.9); padding: 30px; border-radius: 20px; border: 1px solid #333; display: flex; gap: 30px; }
        .menu-col { width: 250px; text-align: center; }
        h1 { color: #ff4757; letter-spacing: 10px; font-size: 50px; margin-bottom: 30px; text-shadow: 0 0 20px #ff4757; }
        h3 { color: #555; text-transform: uppercase; font-size: 14px; margin-bottom: 15px; }
        
        .btn { background: #1a1a1a; border: 1px solid #444; padding: 12px; color: white; cursor: pointer; border-radius: 8px; width: 100%; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn.active { background: #ff4757; border-color: #fff; box-shadow: 0 0 15px #ff4757; }
        .start-btn { background: #fff; color: #000; font-weight: 900; font-size: 24px; margin-top: 40px; width: 320px; padding: 15px; border-radius: 50px; border: none; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="ui">
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <div id="stats">УБИТО: 0</div>
</div>
<div id="ammo-ui">30 / 30</div>

<div id="boss-ui">
    <div style="color: #ff0000; font-weight: 900; letter-spacing: 5px;">BOSS: ВЫСШАЯ УГРОЗА</div>
    <div id="boss-hp-bar"><div id="boss-fill"></div></div>
</div>

<div class="overlay" id="menu">
    <h1>TOTAL PURGE</h1>
    <div class="menu-container">
        <div class="menu-col">
            <h3>Выбор Героя</h3>
            <button class="btn active" id="hero-shooter" onclick="setHero('shooter')">СПЕЦНАЗ</button>
            <button class="btn" id="hero-psycho" onclick="setHero('psycho')">ПСИХ</button>
            <div id="weapon-select" style="margin-top:20px;">
                <h3>Оружие</h3>
                <button class="btn active" id="w-ak" onclick="setWeapon('ak')">AK-47</button>
                <button class="btn" id="w-rpg" onclick="setWeapon('rpg')">RPG-7</button>
            </div>
        </div>
        <div class="menu-col">
            <h3>Локация</h3>
            <button class="btn active" id="map-waste" onclick="setMap('waste')">ПУСТОШЬ</button>
            <button class="btn" id="map-abandon" onclick="setMap('abandon')">ЗАБРОШКА</button>
        </div>
    </div>
    <button class="start-btn" onclick="start()">В БОЙ</button>
</div>

<canvas id="g"></canvas>

<script>
const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
let active = false, frame = 0, kills = 0, bossActive = false;
let config = { hero: 'shooter', weapon: 'ak', map: 'waste' };

let player = { x: 1250, y: 1250, hp: 100, angle: 0, anim: 0, ammo: 30, maxAmmo: 30, reload: 0, radius: 35 };
let zombies = [], particles = [], bloodSpots = [], walls = [], bullets = [];
let keys = {}, mouse = {x:0, y:0, down:false};

const imgs = { bg: new Image(), p: new Image(), z: new Image(), boss: new Image(), axe: new Image() };
imgs.bg.src = 'background.jpg'; 
imgs.p.src = 'player.png'; 
imgs.z.src = 'zombie.png'; 
imgs.boss.src = 'boss.png'; 
imgs.axe.src = 'axe.png';

function setHero(h) {
    config.hero = h;
    document.getElementById('hero-shooter').className = h=='shooter'?'btn active':'btn';
    document.getElementById('hero-psycho').className = h=='psycho'?'btn active':'btn';
    document.getElementById('weapon-select').style.display = h=='shooter'?'block':'none';
    imgs.p.src = (h === 'shooter') ? 'player.png' : 'psycho.png';
}

function setWeapon(w) {
    config.weapon = w;
    document.getElementById('w-ak').className = w=='ak'?'btn active':'btn';
    document.getElementById('w-rpg').className = w=='rpg'?'btn active':'btn';
    player.maxAmmo = (w === 'ak') ? 30 : 1;
    player.ammo = player.maxAmmo;
}

function setMap(m) {
    config.map = m;
    document.getElementById('map-waste').className = m=='waste'?'btn active':'btn';
    document.getElementById('map-abandon').className = m=='abandon'?'btn active':'btn';
}

function genWalls() {
    walls = [];
    if(config.map === 'abandon') {
        for(let i=0; i<18; i++) {
            walls.push({ x: Math.random()*2000+250, y: Math.random()*2000+250, w: 180, h: 180 });
        }
    }
}

function spawnBlood(x, y, count, isDead) {
    for(let i=0; i<count; i++) {
        particles.push({ x:x, y:y, vx:(Math.random()-0.5)*12, vy:(Math.random()-0.5)*12, r:Math.random()*3+1, life:25, type:'blood' });
    }
    if(isDead) bloodSpots.push({ x:x, y:y, r:Math.random()*25+15, op:0.5 });
}

function createExplosion(x, y) {
    for(let i=0; i<35; i++) {
        particles.push({ x:x, y:y, vx:(Math.random()-0.5)*20, vy:(Math.random()-0.5)*20, r:Math.random()*12+4, life:35, type:'fire', color: Math.random()>0.5?'#ff4500':'#ffae00' });
    }
}

function checkWall(px, py) {
    if(px < 50 || px > 2450 || py < 50 || py > 2450) return true;
    for(let w of walls) {
        if(px + player.radius > w.x && px - player.radius < w.x + w.w && py + player.radius > w.y && py - player.radius < w.y + w.h) return true;
    }
    return false;
}

function start() { genWalls(); active = true; document.getElementById('menu').style.display='none'; document.getElementById('ui').style.display='block'; if(config.hero==='shooter') document.getElementById('ammo-ui').style.display='block'; loop(); }

window.onkeydown=e=>keys[e.code]=true; window.onkeyup=e=>keys[e.code]=false;
window.onmousemove=e=>{ mouse.x=e.clientX; mouse.y=e.clientY; };
window.onmousedown=()=>mouse.down=true; window.onmouseup=()=>mouse.down=false;

function loop() {
    if(!active) return; frame++;
    
    // СИСТЕМА ДВИЖЕНИЯ БЕЗ ФРИЗОВ
    let speed = 6.5;
    let nextX = player.x;
    let nextY = player.y;

    if(keys['KeyW']) nextY -= speed;
    if(keys['KeyS']) nextY += speed;
    if(keys['KeyA']) nextX -= speed;
    if(keys['KeyD']) nextX += speed;

    // Скольжение вдоль стен: проверяем X и Y отдельно
    if(!checkWall(nextX, player.y)) player.x = nextX;
    if(!checkWall(player.x, nextY)) player.y = nextY;

    player.angle = Math.atan2(mouse.y-window.innerHeight/2, mouse.x-window.innerWidth/2);

    // АТАКА
    if(mouse.down) {
        if(config.hero === 'psycho' && frame % 22 === 0) {
            player.anim = 12;
            zombies.forEach(z => { if(Math.hypot(player.x-z.x, player.y-z.y) < 160) { z.hp -= 40; spawnBlood(z.x, z.y, 10, z.hp<=0); } });
        }
        if(config.hero === 'shooter' && player.ammo > 0 && player.reload <= 0) {
            let rate = (config.weapon === 'ak') ? 8 : 60;
            if(frame % rate === 0) {
                bullets.push({ x:player.x, y:player.y, a:player.angle, s:18, type:config.weapon });
                player.ammo--;
                if(player.ammo <= 0) player.reload = 110;
            }
        }
    }
    if(player.reload > 0) { player.reload--; if(player.reload === 0) player.ammo = player.maxAmmo; }
    if(player.anim > 0) player.anim--;

    // ПУЛИ
    bullets.forEach((b, bi) => {
        b.x += Math.cos(b.a)*b.s; b.y += Math.sin(b.a)*b.s;
        zombies.forEach(z => {
            if(Math.hypot(b.x-z.x, b.y-z.y) < z.s/2) {
                if(b.type === 'rpg') {
                    createExplosion(b.x, b.y);
                    zombies.forEach(t => { if(Math.hypot(b.x-t.x, b.y-t.y) < 220) { t.hp -= 200; spawnBlood(t.x, t.y, 12, t.hp<=0); } });
                } else { z.hp -= 5; spawnBlood(z.x, z.y, 4, z.hp<=0); }
                bullets.splice(bi, 1);
            }
        });
        if(b.x<0||b.x>2500||b.y<0||b.y>2500) bullets.splice(bi, 1);
    });

    // ВРАГИ
    if(frame % 30 === 0 && zombies.length < 45) zombies.push({x:Math.random()*2400+50, y:Math.random()*2400+50, hp:10, s:80, type:'normal'});
    if(kills >= 50 && !bossActive) { bossActive = true; document.getElementById('boss-ui').style.display='block'; zombies.push({x:1250, y:1250, hp:1500, maxHp:1500, s:250, type:'boss'}); }

    zombies.forEach((z, i) => {
        let a = Math.atan2(player.y-z.y, player.x-z.x);
        let s = (z.type === 'boss') ? 2.8 : 3.8;
        z.x += Math.cos(a)*s; z.y += Math.sin(a)*s;
        if(z.hp <= 0) { if(z.type === 'boss') { bossActive=false; document.getElementById('boss-ui').style.display='none'; } zombies.splice(i,1); kills++; }
        if(Math.hypot(player.x-z.x, player.y-z.y) < z.s/2.2) player.hp -= 0.8;
        if(z.type === 'boss') document.getElementById('boss-fill').style.width = (z.hp/z.maxHp)*100+'%';
    });

    particles.forEach((p, i) => { p.x+=p.vx; p.y+=p.vy; p.life--; if(p.life<=0) particles.splice(i,1); });

    draw();
    if(player.hp > 0) requestAnimationFrame(loop); else location.reload();
}

function draw() {
    canvas.width=window.innerWidth; canvas.height=window.innerHeight;
    ctx.save(); ctx.translate(canvas.width/2-player.x, canvas.height/2-player.y);
    
    ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, 2500, 2500);
    if(imgs.bg.complete) { ctx.globalAlpha = 0.3; ctx.drawImage(imgs.bg, 0, 0, 2500, 2500); ctx.globalAlpha = 1.0; }

    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    for(let i=0; i<=2500; i+=125) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,2500); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(2500,i); ctx.stroke(); }

    bloodSpots.forEach(s => { ctx.fillStyle = `rgba(130, 0, 0, ${s.op})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); });

    walls.forEach(w => { 
        ctx.fillStyle = "#2a2a2a"; ctx.fillRect(w.x, w.y, w.w, w.h); 
        ctx.strokeStyle="#444"; ctx.lineWidth=2; ctx.strokeRect(w.x, w.y, w.w, w.h);
        ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x+w.w, w.y+w.h); ctx.stroke();
    });

    zombies.forEach(z => {
        let img = (z.type === 'boss') ? imgs.boss : imgs.z;
        if(z.type === 'boss') { ctx.shadowBlur = 40; ctx.shadowColor = "red"; }
        ctx.drawImage(img, z.x-z.s/2, z.y-z.s/2, z.s, z.s);
        ctx.shadowBlur = 0;
    });

    bullets.forEach(b => { ctx.fillStyle = (b.type==='ak')?"#f1c40f":"#ff4500"; ctx.beginPath(); ctx.arc(b.x, b.y, (b.type==='ak'?3:10), 0, 7); ctx.fill(); });

    ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
    if(imgs.p.complete) ctx.drawImage(imgs.p, -45, -45, 90, 90);
    if(config.hero === 'psycho') { ctx.save(); let swing = player.anim > 0 ? (player.anim * 0.25) : 0; ctx.rotate(0.6 - swing); ctx.drawImage(imgs.axe, 18, -42, 75, 75); ctx.restore(); }
    ctx.restore();

    particles.forEach(p => { ctx.fillStyle = p.color || "#aa0000"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
    ctx.restore();

    document.getElementById('hp-fill').style.width = player.hp + '%';
    document.getElementById('stats').innerText = "УБИТО: " + kills;
    document.getElementById('ammo-ui').innerText = player.reload > 0 ? "RELOADING..." : player.ammo + " / " + player.maxAmmo;
    document.getElementById('ammo-ui').style.color = player.reload > 0 ? "red" : "#f1c40f";
}
</script>
</body>
</html>
